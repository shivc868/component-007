    <link

  <body>
    <!--
      REEL — pinned split-column showreel. The frame is cut down the middle;
      the next slide wipes up in the left column and down in the right one.

        __pin              pinned frame, nothing inside scrolls
          __column--left     50%-wide window, clips its contents
            __stage            full-frame wide
          __column--right    same again
          __chrome           nav and wordmark, never clipped

      Slides are written once, in the <template> below. main.js clones them
      into both stages, so leave the stages empty.
    -->
    <section class="mfa-reel" aria-label="Selected work">
      <div class="mfa-reel__pin" data-mfa-pin>
        <!-- the right column is a visual duplicate of the left, so inert takes
             it out of the screen reader and the tab order -->
        <div class="mfa-reel__column mfa-reel__column--left">
          <div class="mfa-reel__stage" data-mfa-stage="left"></div>
        </div>
        <div class="mfa-reel__column mfa-reel__column--right" inert>
          <div class="mfa-reel__stage" data-mfa-stage="right"></div>
        </div>

        <nav
          class="mfa-reel__chrome mfa-reel__chrome--top"
          aria-label="Primary"
        >
          <a class="mfa-reel__chrome-item" href="#components">Components</a>
          <a class="mfa-reel__chrome-item" href="#about">About</a>
          <a class="mfa-reel__chrome-item" href="#contact">Get in touch</a>
        </nav>

        <!-- the wordmark, split across the bottom three corners -->
        <p class="mfa-reel__chrome mfa-reel__chrome--bottom" aria-hidden="true">
          <span class="mfa-reel__chrome-item">Made</span>
          <span class="mfa-reel__chrome-item">For</span>
          <span class="mfa-reel__chrome-item">Award</span>
        </p>
      </div>

      <!--
        THE SLIDES — one <article> each, in order. Add, remove or reorder
        freely.

          style="--mfa-accent"  headline and label colour for the slide
          __img                 one or two per slide
          __kicker-line         one per line above the headline
          __line                one word per line; lines never wrap, so if a
                                word runs past 10 characters raise
                                --mfa-longest-line in style.css
          __status              small line under the headline
          __cta                 optional

        fetchpriority stays "high" on the first photo and "low" on the rest.
        No loading="lazy": off-screen slides are positioned with transforms,
        so lazy images never trip their threshold and arrive as black frames.
      -->
      <template data-mfa-slides>
        <article class="mfa-reel__slide" style="--mfa-accent: #7fe9fb">
          <div class="mfa-reel__inner">
            <div class="mfa-reel__media">
              <div class="mfa-reel__media-inner">
                <img
                  class="mfa-reel__img"
                  src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1600&q=80"
                  alt=""
                  fetchpriority="high"
                  decoding="async"
                />
              </div>
            </div>
            <div class="mfa-reel__veil"></div>
            <div class="mfa-reel__copy">
              <div class="mfa-reel__copy-layer">
                <p class="mfa-reel__kicker">
                  <span class="mfa-reel__kicker-line">Content &amp; Marketing</span>
                  <span class="mfa-reel__kicker-line">Web &amp; Digital</span>
                  <span class="mfa-reel__kicker-line">Brand &amp; Identity</span>
                </p>
                <h2 class="mfa-reel__title">
                  <span class="mfa-reel__line">OpenAI</span>
                  <span class="mfa-reel__line">Business</span>
                </h2>
                <p class="mfa-reel__status">Coming soon</p>
              </div>
            </div>
          </div>
        </article>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Raleway:wght@400..600&family=Manrope:wght@400..600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>component-007</title>
  </head>
  <body>
    <!--
      REEL — the component.

      A pinned full-frame showreel. The frame is split down the middle into two
      columns, and the next slide wipes DOWN in the right one and UP in the
      left one, both at the same rate.

      Only these four boxes are written by hand. Everything inside the two
      stages is built from the CONTENT array at the top of src/main.js, so
      adding or removing a slide needs no edits in this file.

        __pin              pinned frame; nothing inside it scrolls
          __column--left     50%-wide window, clips everything inside it
            __stage            full-frame wide, so content ignores the column
          __column--right    the same again
          __front            current slide's text, whole and unclipped
          __chrome           site nav and footer, never clipped

      Each column carries its own full-width copy of every slide and only clips
      it, which is what lets a headline read straight across the split. The
      text is cut down that same middle line into two halves that shear past
      each other as a slide changes, then close back into one.
    -->
    <section class="mfa-reel" aria-label="Selected work">
      <div class="mfa-reel__pin" data-mfa-pin>
        <div class="mfa-reel__column mfa-reel__column--left" data-mfa-column="left">
          <div class="mfa-reel__stage" data-mfa-stage="left"></div>
        </div>
        <div class="mfa-reel__column mfa-reel__column--right" data-mfa-column="right">
          <div class="mfa-reel__stage" data-mfa-stage="right"></div>
        </div>

        <!-- current slide's copy: unclipped, above both columns, and the only
             copy that is interactive or exposed to assistive tech -->
        <div class="mfa-reel__front" data-mfa-front></div>

        <nav class="mfa-reel__chrome mfa-reel__chrome--top" aria-label="Primary">
          <a class="mfa-reel__chrome-item" href="#work">Work</a>
          <a class="mfa-reel__chrome-item" href="#info">Info</a>
          <a class="mfa-reel__chrome-item" href="#contact">Contact us</a>
        </nav>

        <p class="mfa-reel__chrome mfa-reel__chrome--bottom" aria-hidden="true">
          <span class="mfa-reel__chrome-item">Glitch</span>
          <span class="mfa-reel__chrome-item">&amp;</span>
          <span class="mfa-reel__chrome-item">Grit</span>
        </p>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

    <!--
      REEL — the component.

      A pinned full-frame showreel. The frame is split down the middle into two
      columns, and the next slide wipes DOWN in the right one and UP in the
      left one, both at the same rate.

        __pin              pinned frame; nothing inside it scrolls
          __column--left     50%-wide window, clips everything inside it
            __stage            full-frame wide, so content ignores the column
          __column--right    the same again
          __chrome           site nav and footer, never clipped

      Each column carries its own full-width copy of every slide and only clips
      it, which is what lets a headline read straight across the split. The
      text is cut down that same middle line into two halves that shear past
      each other as a slide changes, then close back into one.

      Write each slide ONCE, in the template at the bottom of this file.
      main.js clones it into both columns and doubles the text so the halves
      have something to shear. The two stages start empty on purpose — never
      put slides in them by hand.
    -->
    <section class="mfa-reel" aria-label="Selected work">
      <div class="mfa-reel__pin" data-mfa-pin>
        <!-- the left column carries the readable copy of the text; the right
             one is a pixel duplicate, so `inert` takes it out of both the
             screen reader and the tab order in one attribute -->
        <div class="mfa-reel__column mfa-reel__column--left">
          <div class="mfa-reel__stage" data-mfa-stage="left"></div>
        </div>
        <div class="mfa-reel__column mfa-reel__column--right" inert>
          <div class="mfa-reel__stage" data-mfa-stage="right"></div>
        </div>

        <nav
          class="mfa-reel__chrome mfa-reel__chrome--top"
          aria-label="Primary"
        >
          <a class="mfa-reel__chrome-item" href="#work">Work</a>
          <a class="mfa-reel__chrome-item" href="#info">Info</a>
          <a class="mfa-reel__chrome-item" href="#contact">Contact us</a>
        </nav>

        <p class="mfa-reel__chrome mfa-reel__chrome--bottom" aria-hidden="true">
          <span class="mfa-reel__chrome-item">Glitch</span>
          <span class="mfa-reel__chrome-item">&amp;</span>
          <span class="mfa-reel__chrome-item">Grit</span>
        </p>
      </div>

      <!--
        THE SLIDES — this is the part you edit.

        One <article> per slide, in order. Add, remove or reorder them freely;
        nothing else in this file and nothing in main.js needs to change.

          style="--mfa-accent"  the slide's colour: headline and every label
          __img                 one or two per slide; two share the frame
          __kicker-line         one per line above the headline
          __line                one word per line, two lines. They never wrap,
                                so keep them to single words — and if a word is
                                longer than 10 characters, raise
                                --mfa-longest-line in style.css to match
          __status              the small line under the headline
          __cta                 optional — delete the tag for a slide with no link

        Keep fetchpriority="high" on the first slide's photo and "low" on the
        rest: only the first slide is on screen when the page loads, but the
        others still have to load up front. Do NOT use loading="lazy" here —
        off-screen slides are moved into place with transforms, which never
        trips the lazy-load threshold, so the photo arrives as a black frame.
      -->
      <template data-mfa-slides>
        <article class="mfa-reel__slide" style="--mfa-accent: #7fe9fb">
          <div class="mfa-reel__inner">
            <div class="mfa-reel__media">
              <div class="mfa-reel__media-inner">
                <img
                  class="mfa-reel__img"
                  src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1600&q=80"
                  alt=""
                  fetchpriority="high"
                  decoding="async"
                />
              </div>
            </div>
            <div class="mfa-reel__veil"></div>
            <div class="mfa-reel__copy">
              <div class="mfa-reel__copy-layer">
                <p class="mfa-reel__kicker">
                  <span class="mfa-reel__kicker-line">Content &amp; Marketing</span>
                  <span class="mfa-reel__kicker-line">Web &amp; Digital</span>
                  <span class="mfa-reel__kicker-line">Brand &amp; Identity</span>

                <h2 class="mfa-reel__title">

                  <span class="mfa-reel__line">Business</span>
                </h2>
                <p class="mfa-reel__status">Coming soon</p>
              </div>
            </div>
          </div>
        </article>
